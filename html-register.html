<!DOCTYPE html>
<html lang="fa">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ایجاد حساب کاربری</title>
        <link rel="stylesheet" href="D:\login-register-ui\css-register.css">
    </head>
    <body>
        <main class="register-page">
            <div class="register-card">
                <h1>ایجاد حساب کاربری</h1>
                <p class="pragraph 1">برای ایجاد حساب کاربری اطلاعات خود را وارد کنید </p>
                <form>
                    <div class="name">
                        <input type="text" id="name" placeholder="نام کاربری">
                    </div>
                    <div class="phonenumber">
                        <input type="text" id="phonenumber" placeholder="شماره موبایل یا پست الکترونیک">
                    </div>
                    <div class="password">
                        <input type="text" id="password" placeholder="رمز عبور">
                    </div>
                    <button type="submit">ثبت نام</button>
                </form>
                    <p class="paragraph2">قبلا حساب دارید؟ <a href="#">ورود</a></p>
            </div>
        </main>
    </body>
</html>
